version: '3.8'

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ipnak_root
      MYSQL_DATABASE: ipnak
      MYSQL_USER: ipnak
      MYSQL_PASSWORD: ipnak_local
    ports:
      - "3306:3306"
    volumes:
      - ipnak_db_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

volumes:
  ipnak_db_data:
