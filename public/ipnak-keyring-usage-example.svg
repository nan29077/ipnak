<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- 배경 -->
  <rect width="400" height="300" fill="#0d1b2a"/>

  <!-- 물고기 실루엣 (농어/배스, 바닥에 납작하게 놓인 형태) -->
  <g transform="translate(200,160)">
    <!-- 몸통 -->
    <ellipse cx="0" cy="0" rx="95" ry="32" fill="#1a2e42"/>
    <!-- 꼬리 -->
    <polygon points="-95,0 -130,-22 -130,22" fill="#1a2e42"/>
    <!-- 등지느러미 -->
    <ellipse cx="20" cy="-30" rx="38" ry="10" fill="#1a2e42" transform="rotate(-8,20,-30)"/>
    <!-- 배지느러미 -->
    <ellipse cx="10" cy="30" rx="22" ry="8" fill="#1a2e42" transform="rotate(6,10,30)"/>
    <!-- 가슴지느러미 -->
    <ellipse cx="60" cy="18" rx="18" ry="7" fill="#1a2e42" transform="rotate(20,60,18)"/>
    <!-- 아가미선 -->
    <path d="M50,-25 Q55,0 50,25" stroke="#253d57" strokeWidth="2" fill="none"/>
    <!-- 눈 -->
    <circle cx="82" cy="-6" r="5" fill="#253d57"/>
    <circle cx="82" cy="-6" r="2.5" fill="#0d1b2a"/>
    <!-- 입 -->
    <path d="M97,-2 Q100,2 97,6" stroke="#253d57" strokeWidth="2" fill="none" strokeLinecap="round"/>
  </g>

  <!-- 점선 키링 원 1 (왼쪽 위) -->
  <circle cx="72" cy="80" r="24" fill="none" stroke="#eab308" strokeWidth="2" stroke-dasharray="5,4" opacity="0.45"/>

  <!-- 점선 키링 원 2 (오른쪽 위) -->
  <circle cx="340" cy="100" r="24" fill="none" stroke="#eab308" strokeWidth="2" stroke-dasharray="5,4" opacity="0.45"/>

  <!-- 점선 키링 원 3 (아래 왼쪽) -->
  <circle cx="100" cy="240" r="24" fill="none" stroke="#eab308" strokeWidth="2" stroke-dasharray="5,4" opacity="0.45"/>

  <!-- 실제 입낚키링 디스크 (오른쪽 아래 선명하게) -->
  <g transform="translate(316,216)">
    <!-- 노란 원 배경 -->
    <circle cx="0" cy="0" r="24" fill="#eab308"/>
    <!-- 흰색 테두리 링 -->
    <circle cx="0" cy="0" r="24" fill="none" stroke="white" strokeWidth="3"/>
    <!-- 입낚 로고 (viewBox 60 32 96 132 → 중앙 맞게 스케일) -->
    <g transform="translate(-12,-16) scale(0.25)">
      <!-- viewBox 60 32 96 132, 중심 이동: cx=108, cy=98 → 0,0 -->
      <g transform="translate(-108,-98)">
        <path d="M92 52V118C92 150 138 150 138 116C138 98 118 96 110 110" stroke="white" strokeWidth="10" strokeLinecap="round" fill="none"/>
        <path d="M74 62L92 46L110 62" stroke="white" strokeWidth="10" strokeLinecap="round" strokeLinejoin="round" fill="none"/>
      </g>
    </g>
  </g>

  <!-- 안내 레이블 -->
  <text x="316" y="253" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#eab308" font-weight="bold">입낚키링</text>
</svg>
