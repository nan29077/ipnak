<svg viewBox="0 0 520 300" xmlns="http://www.w3.org/2000/svg" style="background:#1a2340;">
  <text x="130" y="30" text-anchor="middle" font-size="14" fill="#aaaaaa" font-family="Arial, sans-serif">현재 (화살표)</text>
  <text x="390" y="30" text-anchor="middle" font-size="14" fill="#F5A623" font-family="Arial, sans-serif">변경안 (낚시바늘)</text>
  <line x1="260" y1="15" x2="260" y2="280" stroke="#333333" stroke-width="1"/>

  <!-- LEFT: current arrow -->
  <g transform="translate(130,160)">
    <circle cx="0" cy="0" r="95" fill="#F5A623"/>
    <circle cx="0" cy="0" r="73" fill="#1a2340"/>
    <ellipse cx="0" cy="-8" rx="38" ry="34" fill="#7B4F2E"/>
    <circle cx="-28" cy="-36" r="12" fill="#7B4F2E"/>
    <circle cx="28" cy="-36" r="12" fill="#7B4F2E"/>
    <circle cx="-28" cy="-36" r="7" fill="#3d2210"/>
    <circle cx="28" cy="-36" r="7" fill="#3d2210"/>
    <ellipse cx="0" cy="2" rx="22" ry="16" fill="#F5A623"/>
    <circle cx="-13" cy="-14" r="5" fill="#1a2340"/>
    <circle cx="13" cy="-14" r="5" fill="#1a2340"/>
    <ellipse cx="0" cy="-2" rx="6" ry="4" fill="#1a2340"/>
    <path d="M -38,30 A 46,46 0 1,1 30,54" fill="none" stroke="#F5A623" stroke-width="5" stroke-linecap="round"/>
    <polygon points="18,42 32,60 46,42" fill="#F5A623"/>
  </g>

  <!-- RIGHT: fishing hook -->
  <g transform="translate(390,160)">
    <circle cx="0" cy="0" r="95" fill="#F5A623"/>
    <circle cx="0" cy="0" r="73" fill="#1a2340"/>
    <ellipse cx="0" cy="-8" rx="38" ry="34" fill="#7B4F2E"/>
    <circle cx="-28" cy="-36" r="12" fill="#7B4F2E"/>
    <circle cx="28" cy="-36" r="12" fill="#7B4F2E"/>
    <circle cx="-28" cy="-36" r="7" fill="#3d2210"/>
    <circle cx="28" cy="-36" r="7" fill="#3d2210"/>
    <ellipse cx="0" cy="2" rx="22" ry="16" fill="#F5A623"/>
    <circle cx="-13" cy="-14" r="5" fill="#1a2340"/>
    <circle cx="13" cy="-14" r="5" fill="#1a2340"/>
    <ellipse cx="0" cy="-2" rx="6" ry="4" fill="#1a2340"/>
    <path d="M -38,30 A 46,46 0 1,1 30,54" fill="none" stroke="#F5A623" stroke-width="5" stroke-linecap="round"/>
    <!-- hook shaft -->
    <line x1="30" y1="54" x2="36" y2="30" stroke="#F5A623" stroke-width="5" stroke-linecap="round"/>
    <!-- hook eye -->
    <circle cx="36" cy="25" r="5" fill="none" stroke="#F5A623" stroke-width="3.5"/>
    <!-- hook bend -->
    <path d="M 36,32 Q 56,26 56,44 Q 56,60 40,60" fill="none" stroke="#F5A623" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- barb -->
    <line x1="40" y1="60" x2="30" y2="54" stroke="#F5A623" stroke-width="3" stroke-linecap="round"/>
  </g>

  <text x="130" y="278" text-anchor="middle" font-size="12" fill="#888888" font-family="Arial, sans-serif">현재</text>
  <text x="390" y="278" text-anchor="middle" font-size="12" fill="#F5A623" font-family="Arial, sans-serif">낚시바늘 적용시</text>
</svg>
